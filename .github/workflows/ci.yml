name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai:
    name: AI service (lint, test, eval)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    env:
      # No Redis or Gemini in CI: tests use fakes, and the cache is turned off.
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai/requirements*.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check . scripts
          ruff format --check . scripts

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('ai/coursewise/config.py') }}

      - name: Build index
        run: python -m coursewise.ingest

      - name: Tests
        run: pytest -q

      - name: Retrieval eval
        run: python eval/run_retrieval_eval.py

  web:
    name: Web app (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Placeholders: the build only needs these to exist.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [ai, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai/Dockerfile
          push: false
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=placeholder
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
